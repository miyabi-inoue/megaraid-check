name: RPM build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        el:
          - 8
          - 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build RPM for EL${{ matrix.el }}
        run: |
          docker run --rm \
            -e VERSION="${GITHUB_REF_NAME}" \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rockylinux:${{ matrix.el }} \
            /bin/bash -c '
              set -e

              dnf -y install \
                rpm-build \
                rpmdevtools \
                systemd-rpm-macros \
                tar \
                gzip

              echo "unitdir: $(rpm --eval "%{_unitdir}")"
              echo "dist: $(rpm --eval "%{?dist}")"

              rpmdev-setuptree

              echo "%_buildhost localhost" > ~/.rpmmacros

              curl -L \
                -o ~/rpmbuild/SOURCES/megaraid-check-${VERSION}.tar.gz \
                https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${VERSION}.tar.gz

              cp packaging/rpm/megaraid-check.spec \
                ~/rpmbuild/SPECS/

              rpmbuild -ba \
                ~/rpmbuild/SPECS/megaraid-check.spec

              mkdir -p /workspace/artifacts/el${{ matrix.el }}

              cp ~/rpmbuild/RPMS/noarch/*.rpm \
                /workspace/artifacts/el${{ matrix.el }}/

              cp ~/rpmbuild/SRPMS/*.src.rpm \
                /workspace/artifacts/el${{ matrix.el }}/
            '

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megaraid-check-el${{ matrix.el }}
          path: artifacts/el${{ matrix.el }}/

  upload-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-rpm

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download EL8 RPM artifacts
        uses: actions/download-artifact@v5
        with:
          name: megaraid-check-el8
          path: artifacts/el8

      - name: Download EL9 RPM artifacts
        uses: actions/download-artifact@v5
        with:
          name: megaraid-check-el9
          path: artifacts/el9

      - name: Show release files
        run: find artifacts -type f -print

      - name: Install RPM signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg

      - name: Import RPM signing key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | \
            gpg --batch --import

      - name: Configure RPM signing
        env:
          RPM_GPG_KEY_ID: ${{ secrets.RPM_GPG_KEY_ID }}
        run: |
          cat > ~/.rpmmacros <<EOF
          %_signature gpg
          %_gpg_name ${RPM_GPG_KEY_ID}
          %__gpg /usr/bin/gpg
          EOF

      - name: Sign RPM packages
        env:
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
          RPM_GPG_KEY_ID: ${{ secrets.RPM_GPG_KEY_ID }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          cat > ~/.gnupg/gpg.conf <<'EOF'
          pinentry-mode loopback
          batch
          EOF

          cat > ~/.gnupg/gpg-agent.conf <<'EOF'
          allow-loopback-pinentry
          EOF

          gpgconf --kill gpg-agent

          printf '%s\n' "$RPM_GPG_PASSPHRASE" | \
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --local-user "$RPM_GPG_KEY_ID" \
              --detach-sign \
              --output "$RUNNER_TEMP/gpg-unlock.sig" \
              /dev/null

          rm -f "$RUNNER_TEMP/gpg-unlock.sig"

          for rpm_file in \
            artifacts/el8/*.noarch.rpm \
            artifacts/el9/*.noarch.rpm
          do
            rpmsign --addsign "$rpm_file"
          done

      - name: Import public RPM key
        run: |
          sudo rpm --import keys/RPM-GPG-KEY-miyabi

      - name: Verify RPM signatures
        run: |
          for rpm_file in \
            artifacts/el8/*.noarch.rpm \
            artifacts/el9/*.noarch.rpm
          do
            rpm --checksig "$rpm_file"
          done

      - name: Upload RPMs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            artifacts/el8/*.noarch.rpm \
            artifacts/el9/*.noarch.rpm \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
